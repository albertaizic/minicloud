services:
  postgres:
    image: postgres:16-alpine
    container_name: minicloud-postgres
    environment:
      POSTGRES_USER: minicloud
      POSTGRES_PASSWORD: minicloud
      POSTGRES_DB: minicloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minicloud"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
