name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minicloud
          POSTGRES_PASSWORD: minicloud
          POSTGRES_DB: minicloud
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U minicloud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and API tests
        run: npm test
        env:
          DATABASE_URL: postgres://minicloud:minicloud@localhost:5433/minicloud

      - name: Production build
        run: npm run build

      # Queue/cache/cancellation/restart-recovery and preview lifecycle
      # suites run against real Docker here.
      - name: Docker integration tests
        run: npm run test:integration -w @minicloud/api
        env:
          DATABASE_URL: postgres://minicloud:minicloud@localhost:5433/minicloud

  e2e:
    name: Playwright E2E (real stack)
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minicloud
          POSTGRES_PASSWORD: minicloud
          POSTGRES_DB: minicloud
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U minicloud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Serial worker, real Docker builds; generous per-test budget but no
      # continue-on-error — failures must fail the gate.
      - name: Debug environment
        run: |
          echo "=== Docker version ==="
          docker --version
          echo "=== Docker images ==="
          docker images
          echo "=== Disk space ==="
          df -h
          echo "=== Memory ==="
          free -h
          echo "=== CPU ==="
          nproc
      # Bootstrap E2E test database before Playwright starts webServer
      - name: Bootstrap E2E database
        run: npm run pretest:e2e
      - name: Verify E2E database exists
        run: |
          PGPASSWORD=minicloud psql -h localhost -p 5433 -U minicloud -d postgres -c "SELECT datname FROM pg_database WHERE datname = 'minicloud_e2e';"
      - name: Run Playwright suite
        run: |
          set +e
          PLAYWRIGHT_JSON_OUTPUT_NAME=playwright-results.json npx playwright test --config=e2e/playwright.config.ts --reporter=line,json
          status=$?
          exit $status
        env:
          CI: 'true'
      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: playwright-results.json
          retention-days: 5
