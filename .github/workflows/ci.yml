name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minicloud
          POSTGRES_PASSWORD: minicloud
          POSTGRES_DB: minicloud
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U minicloud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and API tests
        run: npm test
        env:
          DATABASE_URL: postgres://minicloud:minicloud@localhost:5433/minicloud

      - name: Production build
        run: npm run build

      # Queue/cache/cancellation/restart-recovery and preview lifecycle
      # suites run against real Docker here.
      - name: Docker integration tests
        run: npm run test:integration -w @minicloud/api
        env:
          DATABASE_URL: postgres://minicloud:minicloud@localhost:5433/minicloud

  e2e:
    name: Playwright E2E (real stack)
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minicloud
          POSTGRES_PASSWORD: minicloud
          POSTGRES_DB: minicloud
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U minicloud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Serial worker, real Docker builds; generous per-test budget but no
      # continue-on-error — failures must fail the gate.
      - name: Run Playwright suite
        run: npm run test:e2e
        env:
          DATABASE_URL: postgres://minicloud:minicloud@localhost:5433/postgres
          CI: 'true'

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: e2e-artifacts/results
          retention-days: 5
